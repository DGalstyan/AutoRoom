# Production stack, run on the server from /opt/autoroom. Images are built
# and pushed to GHCR by .github/workflows/deploy.yml; this file only pulls
# and runs them. Secrets live in a sibling .env, never committed.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ghcr.io/dgalstyan/autoroom-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - uploads:/app/apps/api/uploads
    ports:
      - '127.0.0.1:4000:4000'
    networks: [internal]

  admin:
    image: ghcr.io/dgalstyan/autoroom-admin:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:80'
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  uploads:
