name: Deploy

# Runs after CI finishes on main, and only deploys if CI passed — a red build
# never reaches the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Docker image names must be lowercase; the GitHub owner/repo casing isn't
  # guaranteed to be, so these are spelled out rather than interpolated.
  API_IMAGE: ghcr.io/dgalstyan/autoroom-api
  ADMIN_IMAGE: ghcr.io/dgalstyan/autoroom-admin
  WEB_IMAGE: ghcr.io/dgalstyan/autoroom-web
  # Baked into the admin build — see apps/admin/Dockerfile.
  VITE_API_URL: https://admin.autoroom.am/api
  VITE_WEB_URL: https://autoroom.am

jobs:
  build-api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_WEB_URL=${{ env.VITE_WEB_URL }}
          tags: |
            ${{ env.ADMIN_IMAGE }}:latest
            ${{ env.ADMIN_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-admin, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This job previously had no checkout and no copy step at all — every
      # deploy ran `docker compose` against whatever docker-compose.prod.yml
      # already happened to be sitting in /opt/autoroom, completely
      # disconnected from git. Editing this file (e.g. adding a new service,
      # an env var, a network) had silently never been taking effect in
      # production; only image updates (the `pull`) ever actually landed.
      # This is what let the web→api connectivity bug (every admin-managed
      # homepage section silently falling back to empty) go unnoticed across
      # several deploys — confirmed by locally reproducing the real
      # Dockerfile/compose setup, where the app self-heals correctly once it
      # can actually reach the API, and by this job never checking out or
      # transferring the file that config lives in.
      - name: Sync docker-compose.prod.yml to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.prod.yml'
          target: '/opt/autoroom'

      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/autoroom
            docker compose -f docker-compose.prod.yml pull
            # --force-recreate: a plain `up -d` only recreates containers
            # whose image digest changed, so a service left untouched by a
            # given deploy (e.g. api, when only web's image changed) won't
            # pick up a docker-compose.prod.yml change (like the sync step
            # above just introduced) on its own.
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f
