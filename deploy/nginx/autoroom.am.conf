# Host nginx (not containerized) — terminates TLS via certbot and proxies to
# the web app container published on localhost. Install to
# /etc/nginx/sites-available/ on the server and symlink into sites-enabled/;
# certbot --nginx rewrites this file in place to add the TLS server block.
#
# Mirrors deploy/nginx/admin.autoroom.am.conf's pattern, but this is the
# public marketing site at the bare domain, so it owns the whole root path
# (no prefix to strip).
server {
    listen 80;
    server_name autoroom.am www.autoroom.am;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-mode HMR isn't in play in production, but keep upgrade
        # headers available in case a future feature needs a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js's own build-hashed assets are immutable — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
