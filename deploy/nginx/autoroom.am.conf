# Host nginx (not containerized) — terminates TLS via certbot. Install to
# /etc/nginx/sites-available/ on the server and symlink into sites-enabled/;
# certbot --nginx already added the TLS server block for this host, so only
# the `location /` body below needs to change, not the whole file.
#
# Serves a static "coming soon" placeholder instead of proxying to the web
# app container — the full site is still live and unchanged, just moved to
# v1.autoroom.am (deploy/nginx/v1.autoroom.am.conf) for the run-up to
# relaunching here. Revert by restoring the `proxy_pass` block this
# replaced (see git history of this file) once autoroom.am is ready to go
# live again — no app deploy or DNS change needed either way, this is a
# pure nginx-config swap.
server {
    listen 80;
    server_name autoroom.am www.autoroom.am;

    root /var/www/autoroom-coming-soon;
    index index.html;

    location / {
        try_files /index.html =404;
    }
}
