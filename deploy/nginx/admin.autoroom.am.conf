# Host nginx (not containerized) — terminates TLS via certbot and proxies to
# the two app containers published on localhost. Install to
# /etc/nginx/sites-available/ on the server and symlink into sites-enabled/;
# certbot --nginx rewrites this file in place to add the TLS server block.
server {
    listen 80;
    server_name admin.autoroom.am;

    location = / {
        return 302 /admin/;
    }

    # Trailing slash on proxy_pass strips the /admin/ prefix before
    # forwarding — the admin container serves its build at its own root.
    location /admin/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # File uploads.
        client_max_body_size 25m;
    }
}
