# Host nginx (not containerized) — terminates TLS via certbot and proxies to
# the same web app container the bare domain used to serve directly. Install
# to /etc/nginx/sites-available/ on the server and symlink into
# sites-enabled/; certbot --nginx rewrites this file in place to add the TLS
# server block once a cert is issued for v1.autoroom.am (needs its own cert —
# the existing admin.autoroom.am one has no SAN for this host).
#
# Exists so the full site stays reachable at v1.autoroom.am while
# autoroom.am itself serves the static "coming soon" page
# (deploy/nginx/autoroom.am.conf) — copy of that file's pre-launch-prep
# config, just with this host's server_name. DNS already resolves
# v1.autoroom.am to this server (a wildcard *.autoroom.am record already
# exists) — no DNS change needed, only this nginx config + a cert.
server {
    listen 80;
    server_name v1.autoroom.am;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-mode HMR isn't in play in production, but keep upgrade
        # headers available in case a future feature needs a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js's own build-hashed assets are immutable — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
