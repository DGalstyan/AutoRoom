    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&family=Noto+Sans+Armenian:wght@400;500;600&display=swap"
      rel="stylesheet"

    <style>
      :root {
        --bg: #0b0b0f;
        --accent: #c8a24a;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.6);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          'Noto Sans Armenian',
          'Sora',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        text-align: center;
      }
      .logo {
        width: 220px;
        max-width: 60vw;
        height: auto;
      }
      h1 {
        margin: 0;
        font-family: 'Sora', 'Noto Sans Armenian', sans-serif;
        font-weight: 300;
        font-size: clamp(32px, 6vw, 56px);
        line-height: 1.2;
        color: var(--text);
      }
      h1 span {
        color: var(--accent);
      }
      p {
        margin: 0;
        max-width: 480px;
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
      }
      .contacts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px 24px;
        font-size: 14px;
      }
      .contacts a {
        color: var(--text);
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        transition: border-color 0.2s ease;
      }
      .contacts a:hover {
        border-color: var(--accent);
      }
    </style>
