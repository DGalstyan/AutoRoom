<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AutoRoom</title>
    <style>
      :root {
        --ink: #0b0b0f;
        --paper: #ffffff;
        --muted: #8a8f98;
        --accent: #e4002b;
        --line: #26262e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: var(--ink);
        color: var(--paper);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 30rem;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
      }
      .bar {
        width: 14px;
        height: 22px;
        background: var(--accent);
        border-radius: 2px;
        transform: skewX(-14deg);
      }
      .name {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto 2.5rem;
        max-width: 26rem;
        color: var(--muted);
        line-height: 1.6;
      }
      a.cta {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--paper);
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 500;
        transition:
          border-color 0.18s ease,
          background 0.18s ease;
      }
      a.cta:hover,
      a.cta:focus-visible {
        border-color: var(--accent);
        background: rgba(228, 0, 43, 0.1);
      }
      footer {
        margin-top: 3.5rem;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        a.cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <span class="bar" aria-hidden="true"></span>
        <span class="name">AUTOROOM</span>
      </div>
      <h1>Car import, handled end to end.</h1>
      <p>
        The public website is next up. The back office that runs the catalogue, leads and orders is
        already live.
      </p>
      <a class="cta" href="/admin/">Open the back office &rarr;</a>
      <footer>USA &middot; CHINA &middot; EUROPE &rarr; ARMENIA</footer>
    </main>
  </body>
</html>
