# Served behind the host nginx, which proxies /admin/ here with the prefix
# stripped — so this container owns its own document root, not an /admin
# subpath. The SPA itself was built with base '/admin/' (see Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
